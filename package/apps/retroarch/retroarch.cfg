# RetroArch on LG NetCast (SDL2 "netcast" video/audio). Paths are relative to this folder (run.sh cds here).
video_driver = "gl"
video_context_driver = "sdl_gl"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_scale_integer = "false"
aspect_ratio_index = "22"
audio_driver = "sdl2"
audio_latency = "96"
input_driver = "sdl2"
input_joypad_driver = "sdl2"
menu_driver = "rgui"
rgui_aspect_ratio = "1"
menu_show_core_updater = "false"
menu_show_online_updater = "false"
libretro_directory = ":/cores"
libretro_info_path = ":/info"
system_directory = ":/system"
savefile_directory = ":/saves"
savestate_directory = ":/states"
rgui_browser_directory = ":/roms"
core_options_path = ":/retroarch-core-options.cfg"
config_save_on_exit = "true"
pause_nonactive = "false"
# LG remote: arrows = d-pad, OK = A, CH+ = B, BACK = menu, GREEN = Start, RED = Select,
# YELLOW = X, BLUE = Y, 1/2 = L/R. Quit via the menu (Main Menu > Quit RetroArch).
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "enter"
input_player1_b = "pageup"
input_player1_x = "f3"
input_player1_y = "f4"
input_player1_start = "f2"
input_player1_select = "f1"
input_player1_l = "num1"
input_player1_r = "num2"
input_player1_l2 = "num3"
input_player1_r2 = "num4"
input_menu_toggle = "escape"
input_exit_emulator = "pagedown"
input_enable_hotkey = "nul"
