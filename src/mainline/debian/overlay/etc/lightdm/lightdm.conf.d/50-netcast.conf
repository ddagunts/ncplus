# Xfce on the panel: log user "tv" straight in (no password; the greeter only shows after
# a logout). X runs on vt7; tty1 keeps the root console (Ctrl+Alt+F1, back with Ctrl+Alt+F7).
[Seat:*]
autologin-user=tv
autologin-user-timeout=0
autologin-session=xfce
user-session=xfce
greeter-session=lightdm-gtk-greeter
