# No UART: the journal goes to the kernel log as well, which lands in ramoops and survives
# the watchdog reset (read it back from stock with tools/ramlog.py). Kept in RAM: the root
# is an ext4 image on a FAT stick, so spare it the writes.
[Journal]
Storage=volatile
RuntimeMaxUse=16M
ForwardToKmsg=yes
MaxLevelKMsg=info
