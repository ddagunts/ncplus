# The image ships without host keys (every stick would share them): make them on first start.
# Root's authorized_keys: <stick>/netcast/mainline/authorized_keys (netcast-sshkeys).
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/local/sbin/netcast-sshkeys
ExecStartPre=/usr/sbin/sshd -t
