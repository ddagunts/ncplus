# Xorg on the mt5398_osd KMS driver: one fixed 1920x1080 XRGB8888 plane, no GPU driver
# (SGX544 isn't usable yet), so modesetting with CPU rendering into a shadow buffer and no
# glamor (it would only find llvmpipe). No hardware cursor plane: X draws the cursor.
Section "Device"
	Identifier "mt5398-osd"
	Driver "modesetting"
	Option "AccelMethod" "none"
	Option "ShadowFB" "true"
	Option "PageFlip" "false"
EndSection

# No black screen saver on a lit panel. DPMS off (after 20 idle minutes, or now with
# "xset dpms force off") disables the KMS CRTC, and mt5398_osd then switches the panel
# backlight off through the MICOM; any key or mouse movement turns it back on.
# "xset -dpms" (or OffTime "0" here) keeps the screen on.
Section "ServerFlags"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "20"
EndSection
